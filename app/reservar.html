<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Reservar — HospedaPrime</title>
<link rel="icon" type="image/svg+xml" href="/app/img/logo-h-solido.svg">
<script>(function(){try{var t=localStorage.getItem("hms_theme");if(t==="dark"||t==="light"){document.documentElement.setAttribute("data-theme",t);}}catch(e){}})();</script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/app/css/styles.css">
<style>
  body{display:block}
  .rv-wrap{max-width:760px;margin:0 auto;padding:28px 18px 60px}
  .rv-header{text-align:center;margin-bottom:24px}
  .rv-header h1{font-family:"Plus Jakarta Sans",sans-serif;color:var(--text);font-size:26px;font-weight:800;letter-spacing:-0.03em}
  .rv-header p{color:var(--text-dim);margin-top:6px}
  .rv-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:22px;box-shadow:0 4px 20px var(--shadow);margin-bottom:18px}
  .rv-tipo{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px;border:1px solid var(--border);border-radius:12px;margin-bottom:10px}
  .rv-tipo.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
  .rv-tipo-info b{color:var(--text);font-family:"Plus Jakarta Sans",sans-serif;font-weight:700}
  .rv-tipo-info small{color:var(--text-mute);display:block;margin-top:2px}
  .rv-preco{text-align:right;white-space:nowrap}
  .rv-preco b{color:var(--text);font-size:18px;font-family:"Plus Jakarta Sans",sans-serif;font-weight:800}
  .rv-preco small{display:block;color:var(--text-mute)}
  .rv-esgotado{color:var(--neg);font-size:13px;font-weight:600}
  .rv-msg{padding:20px;text-align:center;color:var(--text-dim)}
  .rv-ok{text-align:center;padding:20px}
  .rv-ok .rv-proto{font-family:"Plus Jakarta Sans",sans-serif;font-size:22px;color:var(--accent);font-weight:800;letter-spacing:1px;margin:8px 0}
  .rv-foot{text-align:center;color:var(--text-mute);font-size:12px;margin-top:28px}
</style>
</head>
<body>
<div class="rv-wrap">
  <div class="rv-header">
    <span class="hp-logo sm" style="justify-content:center;margin-bottom:14px"><svg class="hp-mark" viewBox="0 0 63 75" fill="none" aria-hidden="true"><rect x="0" y="0" width="19" height="75" rx="9.5" fill="currentColor"/><rect x="44" y="0" width="19" height="75" rx="9.5" fill="currentColor"/><rect x="9.5" y="37" width="44" height="19" rx="9.5" fill="#FF5C35"/></svg><span class="hp-name">HospedaPrime</span></span>
    <h1 id="rvHotel">Reservas</h1>
    <p id="rvSub">Consulte disponibilidade e solicite sua reserva</p>
  </div>
  <div id="rvConteudo"><div class="rv-card"><div class="rv-msg">Carregando...</div></div></div>
  <div class="rv-foot">Reservas processadas por HospedaPrime</div>
</div>
<div class="toast-container" id="toastContainer"></div>
<script type="module" src="/app/js/reservar.js"></script>
</body>
</html>
